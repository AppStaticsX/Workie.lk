name: workie
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localization: ^0.3.2
  flutter_svg: ^2.1.0
  flame_lottie: ^0.4.2+14
  flutter_launcher_icons: ^0.14.3
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  fluttertoast: ^8.2.12
  smooth_page_indicator: ^1.2.1
  iconsax_flutter: ^1.0.0
  get: ^4.7.2
  pinput: ^5.0.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.13.1
  http: ^1.5.0
  connectivity_plus: ^6.1.5
  internet_connection_checker_plus: ^2.7.2
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.1
  file_picker: ^10.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  video_player: ^2.10.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http_parser: ^4.1.2
  shimmer_ai: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  generate: true

# Image, Animations, Audios, Videos
  assets:
   - assets/icon/
   - assets/video/
   - assets/animation/
   - assets/image/
   - assets/icon/profession/
   - assets/icon/profession/mono/

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/font/GoogleSans/GoogleSans-Regular.nohints.ttf
        - asset: assets/font/GoogleSans/GoogleSans-Bold.nohints.ttf

    - family: Google Sans Medium
      fonts:
        - asset: assets/font/GoogleSans/GoogleSans-Medium.nohints.ttf

# Flutter launcher icons
flutter_icons:
  android: "ic_launcher"
  image_path: "assets/icon/ic_launcher-web.png"
  min_sdk_android: 21
